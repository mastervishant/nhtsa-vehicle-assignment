name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-docker:
    name: Build, Test and Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nhtsa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d nhtsa"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: nhtsa-vehicle-assignment

    env:
      NODE_ENV: test

      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: nhtsa
      DB_SYNCHRONIZE: true

      NHTSA_BASE_URL: https://vpic.nhtsa.dot.gov/api/vehicles
      NHTSA_TIMEOUT_MS: 30000
      NHTSA_RETRIES: 3

      LOG_LEVEL: info

      CACHE_TTL_SECONDS: 3600
      CACHE_MAX_ITEMS: 20000

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Node.js
      # ------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nhtsa-vehicle-assignment/package-lock.json

      # ------------------------------------------
      # Install dependencies
      # ------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------
      # Lint
      # ------------------------------------------
      - name: Run lint
        run: npm run lint

      # ------------------------------------------
      # Tests
      # ------------------------------------------
      - name: Run tests
        run: npm test

      # ------------------------------------------
      # Test coverage
      # ------------------------------------------
      - name: Run tests with coverage
        run: npm run test:cov

      # ------------------------------------------
      # Build NestJS application
      # ------------------------------------------
      - name: Build application
        run: npm run build

      # ------------------------------------------
      # Upload application build
      # ------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-build
          path: nhtsa-vehicle-assignment/dist
          if-no-files-found: error

      # ------------------------------------------
      # Upload test coverage
      # ------------------------------------------
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: nhtsa-vehicle-assignment/coverage
          if-no-files-found: warn

      # ------------------------------------------
      # Build Docker image
      # ------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t nhtsa-vehicle-assignment:${{ github.sha }} \
            -t nhtsa-vehicle-assignment:latest \
            .

      # ------------------------------------------
      # Verify Docker image
      # ------------------------------------------
      - name: Docker image information
        run: docker images nhtsa-vehicle-assignment
